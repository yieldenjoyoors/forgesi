<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeSI console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>

<header class="appbar">
  <a class="brand" href="/">ForgeSI</a>
  <select id="repo-switch" class="pill-select"><option value="">repos…</option></select>
  <button id="new-repo-btn" class="ghost-pill">+ new repo</button>
  <span style="flex:1"></span>
  <span id="identity" class="mono"></span>
  <form id="signin">
    <input type="text" id="handle" placeholder="you@example.com">
    <button type="submit">sign in</button>
  </form>
</header>

<div id="new-repo-row" class="newrepo-row" style="display:none">
  <input type="text" id="new-repo" placeholder="new repo name">
  <button id="create-repo">create repo</button>
</div>

<main class="repomain">
  <div id="repo-head" style="display:none">
    <h1 id="repo-title"></h1>
    <div id="repo-did" class="did mono"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="tickets">tickets</button>
      <button class="tab" data-tab="proposals">proposals</button>
      <button class="tab" data-tab="fleet">fleet</button>
      <button class="tab" data-tab="todo">todo.md</button>
    </div>
  </div>

  <section id="tab-tickets">
    <div class="ticketlist" id="tickets"><div class="empty">No repo selected.</div></div>
    <div class="newform" id="ticket-form" style="display:none">
      <input type="text" id="new-ticket" placeholder="describe the work — one line, one task">
      <button id="create-ticket">open ticket</button>
    </div>
  </section>

  <section id="tab-proposals" style="display:none">
    <div class="ticketlist" id="proposals"></div>
  </section>

  <section id="tab-fleet" style="display:none">
    <div class="fleetgrid">
      <div>
        <div class="seclabel">runs</div>
        <div id="runs" class="runlist"><div class="empty">—</div></div>
      </div>
      <div>
        <div class="seclabel">live <span class="dot" id="live-dot"></span></div>
        <div id="live" class="runlist"><div class="empty">connecting…</div></div>
      </div>
    </div>
  </section>

  <section id="tab-todo" style="display:none">
    <div class="newform">
      <span id="todo-status" class="mono dim">—</span>
      <button id="save-todo">save</button>
    </div>
    <textarea id="todo-editor" class="mono" spellcheck="false"></textarea>
  </section>

  <div class="flash" id="flash"></div>
</main>

<script type="module" src="/app.js?v=4"></script>
</body>
</html>
