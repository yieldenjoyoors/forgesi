<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeSI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=5b">
</head>
<body>

<header class="appbar">
  <a class="brand" href="/">ForgeSI</a>
  <select id="repo-switch" class="pill-select"><option value="">repos…</option></select>
  <button id="new-repo-btn" class="ghost-pill">+ new repo</button>
  <span class="spacer"></span>
  <button id="identity-btn" class="ghost-pill dim2">sign in</button>
</header>

<div id="new-repo-row" class="newrepo-row" style="display:none">
  <input type="text" id="new-repo" placeholder="new repo name">
  <button id="create-repo" class="ink-pill">create repo</button>
</div>

<main class="repomain">
  <div id="repo-head" style="display:none">
    <h1 id="repo-title"></h1>
    <div id="repo-did" class="did mono"></div>
  </div>

  <div class="workspace" id="workspace" style="display:none">
    <aside class="plan">
      <div class="panel-head">
        <span class="panel-label">plan</span>
        <span class="mono dim2 small">todo.md</span>
        <span class="flex"></span>
        <button id="edit-todo" class="ghost-pill sm">edit</button>
      </div>
      <div id="plan-list" class="plan-list"></div>
      <div class="plan-add">
        <input type="text" id="plan-input" placeholder="add a task — one line" autocomplete="off">
        <button id="plan-add" class="ink-pill">add</button>
      </div>
    </aside>

    <section class="stream">
      <div class="panel-head">
        <span class="panel-label">activity</span>
        <span class="flex"></span>
        <span id="live-dot" class="dot" title="live feed"></span>
      </div>
      <div id="feed" class="feed"></div>
    </section>
  </div>

  <div class="flash" id="flash"></div>
</main>

<!-- auth -->
<div class="overlay" id="auth-modal" hidden>
  <div class="modal">
    <h3>Sign in</h3>
    <p class="dim modal-sub">Your handle — Bluesky or any AT Protocol account. You approve access on your PDS, then come right back.</p>
    <div id="auth-body">
      <input type="text" id="auth-handle" placeholder="you.example.com" autocomplete="off">
      <button id="auth-go" class="ink-pill">continue</button>
    </div>
    <div id="auth-session" style="display:none">
      <p class="mono dim small" id="auth-did"></p>
      <button id="auth-out" class="ghost-pill">sign out</button>
    </div>
    <div class="modal-foot">
      <button id="auth-cancel" class="ghost-pill">close</button>
      <span id="auth-err" class="err"></span>
    </div>
  </div>
</div>

<!-- todo.md sheet -->
<div class="overlay" id="todo-modal" hidden>
  <div class="modal wide">
    <div class="sheet-head">
      <span class="panel-label">todo.md</span>
      <span class="flex"></span>
      <span id="todo-status" class="mono dim small">—</span>
      <button id="save-todo" class="ink-pill">save</button>
    </div>
    <textarea id="todo-editor" class="mono" spellcheck="false"></textarea>
  </div>
</div>

<script type="module" src="/app.js?v=6"></script>
</body>
</html>
