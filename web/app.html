<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeSI console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="appbar">
  <a class="brand" href="/"><img src="/favicon.svg" alt="" width="22" height="22"><span>Forge<b>SI</b></span></a>
  <span class="crumb">console · <b id="crumb-repo">repos</b></span>
  <span class="mono" id="identity" style="margin-left:auto;font-size:11.5px"></span>
  <form id="signin" style="display:flex;gap:6px;margin-left:8px">
    <input type="text" id="handle" placeholder="you.bsky.social" style="width:180px">
    <button type="submit">sign in</button>
  </form>
</header>

<div class="appmain">
  <aside class="sidebar">
    <h3>repos</h3>
    <div class="repolist" id="repos"></div>
    <h3 style="margin-top:22px">fleet</h3>
    <div id="runs" class="runlist"><div class="empty">—</div></div>
    <h3 style="margin-top:22px">new repo</h3>
    <div class="newform" style="flex-direction:column">
      <input type="text" id="new-repo" placeholder="name" style="width:100%">
      <button id="create-repo" style="width:100%">create</button>
    </div>
  </aside>

  <main class="content" id="content">
    <div class="toolbar">
      <h1 id="repo-title">Pick a repo</h1>
      <span class="did mono dim" id="repo-did"></span>
    </div>
    <div class="ticketlist" id="tickets"><div class="empty">No repo selected.</div></div>
    <h3 class="prophead mono dim">proposals &amp; verdicts</h3>
    <div class="ticketlist" id="proposals"></div>
    <div class="newform" id="ticket-form" style="display:none">
      <input type="text" id="new-ticket" placeholder="describe the work — one line, one task" style="flex:1">
      <button id="create-ticket">open ticket</button>
    </div>
    <div class="flash" id="flash"></div>
  </main>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
