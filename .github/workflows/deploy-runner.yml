name: deploy-runner
# The fleet runner: the agent library compiled to wasm and deployed as a
# plain Worker (no containers — the agent is pure Go over HTTP: it
# clones via the knot's smart-HTTP, works with the LLM, pushes, reports).
on:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/deploy-runner.yml"]
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workers-assets-gen
        run: go install github.com/syumai/workers/assets-generator/cmd/workers-assets-gen@a38be30753a4

      - name: Build the runner Worker (wasm)
        working-directory: runner
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          workers-assets-gen -mode=go -o dist-gen
          GOOS=js GOARCH=wasm go build -trimpath -o dist-gen/app.wasm ./cmd/worker

      - name: Deploy the runner Worker
        working-directory: runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KNOT_RUNNER_KEY: ${{ secrets.KNOT_RUNNER_KEY }}
          LLM_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          status=0
          npx -y wrangler@4.156.0 deploy --var KNOT_RUNNER_KEY:$KNOT_RUNNER_KEY --var RUNNER_KEY:$KNOT_RUNNER_KEY --var LLM_KEY:$LLM_KEY 2>&1 | tee deploy.log || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### wrangler deploy output (tail)"
              echo '```'
              tail -80 deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            TAILTXT=$(grep -B2 -A10 "ERROR" deploy.log | tr -d '%' | tr -d '\r' | tr '\n' '|')
            echo "::error::wrangler deploy failed: $TAILTXT"
            exit "$status"
          fi
