name: deploy-runner
# The fleet container: builds the Go agent binary and the runner image,
# then deploys the container app. Runs on push to main (docker is only
# available on GitHub runners — local wrangler cannot build images).
on:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/deploy-runner.yml"]
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agent binary (linux)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o runner/agent ./runner/agent

      - name: Install runner deps
        working-directory: runner
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      - name: Deploy the runner container app
        working-directory: runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KNOT: https://forgesi.org
          LLM_KEY: ${{ secrets.GLM_API_KEY }}
          KNOT_RUNNER_KEY: ${{ secrets.KNOT_RUNNER_KEY }}
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "false"
        run: |
          set -o pipefail
          status=0
          npx -y wrangler@4.156.0 deploy 2>&1 | tee deploy.log || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### wrangler deploy output (tail)"
              echo '```'
              tail -80 deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            TAILTXT=$(tail -60 deploy.log | tr -d '%' | tr -d '\r' | tr '\n' '|')
            echo "::error::wrangler deploy failed: $TAILTXT"
            exit "$status"
          fi
